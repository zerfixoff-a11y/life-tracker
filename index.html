<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfcfa;--dot:#d6d6d0;--card:#fff;--tx:#1b1b1f;--mu:#6d6d76;--ink:#1b1b1f;--bd:#1b1b1f;
--c1:#c4f56a;--c2:#ff6fb5;--c3:#ffd84d;--c4:#3db5ff;--c5:#1fb15a;--c6:#ff3b3b}
@media(prefers-color-scheme:dark){:root{--bg:#17171b;--dot:#2c2c33;--card:#22222a;--tx:#f2f2f5;--mu:#a0a0ad;--ink:#f2f2f5;--bd:#f2f2f5}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--tx);background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/16px 16px;padding:12px 12px 60px}
main{max-width:880px;margin:auto}
h1{font-family:'Permanent Marker',cursive;font-size:clamp(2rem,7vw,3.2rem);margin:.3em 0 .2em;font-weight:400}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
nav button,.btn{font:inherit;font-weight:800;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--c3);color:#1b1b1f;box-shadow:3px 3px 0 var(--bd)}
.btn.go{background:var(--c4);color:#111}
.btn.del{padding:2px 8px;border-color:var(--c6);color:var(--c6);background:none}
:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-family:'Permanent Marker',cursive;font-weight:400;margin:0 0 8px;font-size:1.3rem}
form,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;font-weight:700;color:var(--mu);gap:3px}
input,select{font:inherit;padding:8px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.stars button{font-size:1.9rem;background:none;border:0;cursor:pointer;padding:0 2px;color:var(--mu)}
.stars button.on{color:#f5b800}
.item .stars button{font-size:1.2rem}
.list{max-height:340px;overflow:auto;margin-top:10px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px dashed var(--mu);padding:7px 0}
.item small{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{border:2px solid var(--bd);border-radius:10px;padding:8px}
.stat b{display:block;font-size:1.25rem}.stat span{font-size:.8rem;color:var(--mu)}
.grid{display:grid;grid-template-columns:26px repeat(12,1fr);gap:3px;max-width:520px}
.grid i{font-style:normal;font-size:.65rem;text-align:center;color:var(--mu)}
.grid div{aspect-ratio:1;border:2px solid var(--bd);border-radius:3px;min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;font-weight:700;margin:8px 0}
.leg span:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--bd);margin-right:5px;background:var(--k);vertical-align:-2px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:6px;border-bottom:1px solid var(--mu);text-align:left}
.scroll{overflow-x:auto}
</style></head><body><main>
<h1>Mon Life Tracker</h1>
<div id="who" class="row" style="margin-bottom:6px"></div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
let P=null,D={};
try{P=JSON.parse(localStorage.getItem('lt_profile'))}catch(e){}
const dk=()=>'lifetracker:'+P.email;
const save=()=>{try{if(P)localStorage.setItem(dk(),JSON.stringify(D))}catch(e){}};
function loadD(){
 D=null;try{D=JSON.parse(localStorage.getItem(dk()))}catch(e){}
 if(!D){let old=null;try{old=JSON.parse(localStorage.getItem('lifetracker'))}catch(e){}
  D=old||{};if(old){save();try{localStorage.removeItem('lifetracker')}catch(e){}}}
}
if(P&&P.email)loadD();else P=null;
function login(){
 P={first:$('#l_first').value.trim(),last:$('#l_last').value.trim(),email:$('#l_mail').value.trim().toLowerCase()};
 try{localStorage.setItem('lt_profile',JSON.stringify(P))}catch(e){}
 loadD();render();
}
function logout(){if(confirm('Changer de compte ? Tes données restent enregistrées : retape le même e-mail pour les retrouver.')){P=null;D={};try{localStorage.removeItem('lt_profile')}catch(e){}render()}}
const T={
 sleep:{n:'🌙 Sommeil',f:[['bed','Coucher','time'],['wake','Réveil','time']]},
 food:{n:'🍔 Fast-food',f:[['yes','Fast-food aujourd’hui ?','yn']]},
 screen:{n:'📱 Écran',f:[['min','Temps d’écran (heures, 0 = aucun)','hours']]},
 series:{n:'📺 Séries',f:[['what','Nom de la série','text'],['stars','Note','stars']]},
 shop:{n:'🛍️ Shopping',f:[['amt','Dépensé aujourd’hui (€, 0 = rien)','number']]}
};
const TABS=[...Object.keys(T),'month','global'],NAMES={month:'📅 Résumé du mois',global:'🌍 Résumé global'};
let tab=(()=>{try{const x=localStorage.getItem('lt_tab');return TABS.includes(x)?x:'sleep'}catch(e){return'sleep'}})(),monSel=null,yr=new Date().getFullYear(),star=0;
const curMonth=()=>today().slice(0,7);
const eur=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',')+' €';
const hm=m=>{m=Math.round(m);return Math.floor(m/60)+'h'+p(m%60)};
const tm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const dur=e=>(tm(e.wake)-tm(e.bed)+1440)%1440;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const mlabel=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const COL=h=>h<6?1:h<7?2:h<8?3:h<9?4:h<10?5:6;
const LEG=['Avant 6h','6h – 7h','7h – 8h','8h – 9h','9h – 10h','Après 10h'];

const starBtns=(n,cb)=>[1,2,3,4,5].map(i=>`<button type="button" class="${i<=n?'on':''}" onclick="${cb(i)}" aria-label="${i} étoiles">★</button>`).join('');
function line(t,e){
 if(t=='sleep')return `Couché ${e.bed} → réveil ${e.wake} <small>(${hm(dur(e))} de sommeil)</small>`;
 if(t=='food')return e.yes===false?'🟢 Pas de fast-food':'🔴 Fast-food';
 if(t=='screen')return (+e.min?hm(e.min):'🟢 Aucun écran');
 if(t=='series')return `📺 ${esc(e.what)} <span class="stars">${starBtns(e.stars,i=>`rate(${e.id},${i})`)}</span>`;
 return +e.amt?eur(e.amt):'🟢 Rien dépensé';
}
function stats(t,a){
 if(!a.length)return[];
 const sum=k=>a.reduce((s,e)=>s+(+e[k]||0),0);
 if(t=='sleep'){const d=a.map(dur),w=a.map(e=>tm(e.wake));return[['Nuits',a.length],['Sommeil moyen',hm(d.reduce((x,y)=>x+y)/a.length)],['Réveil moyen',hm(w.reduce((x,y)=>x+y)/a.length)],['Plus longue nuit',hm(Math.max(...d))],['Plus courte nuit',hm(Math.min(...d))]]}
 if(t=='food'){const y=new Set(a.filter(e=>e.yes!==false).map(e=>e.date)),n=new Set(a.filter(e=>e.yes===false&&!y.has(e.date)).map(e=>e.date));return[['Jours avec fast-food',y.size],['Jours sans',n.size]]}
 if(t=='screen'){const days=new Set(a.map(e=>e.date)).size,tot=sum('min');return[['Total',hm(tot)],['Moyenne / jour',hm(tot/days)],['Jours suivis',days]]}
 if(t=='series'){const r=a.filter(e=>e.stars>0),b=[...a].sort((x,y)=>y.stars-x.stars)[0];return[['Séries suivies',a.length],['Note moyenne',r.length?(r.reduce((s,e)=>s+e.stars,0)/r.length).toFixed(1)+' ★':'–'],['Mieux notée',esc(b.what)]]}
 const b=[...a].sort((x,y)=>(+y.amt||0)-(+x.amt||0))[0],nd=new Set(a.filter(e=>+e.amt>0).map(e=>e.date)).size;
 return[['Dépensé',eur(sum('amt'))],['Jours avec dépense',nd],['Plus grosse dépense',+b.amt?eur(b.amt):'–']];
}
const statsHTML=(t,a)=>{const s=stats(t,a);return s.length?`<div class="stats">${s.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`:'<small>Aucune donnée.</small>'};
const arr=(t,f=()=>true)=>(D[t]||[]).filter(f);

function summary(f,title){
 const money=arr('shop',f).reduce((s,e)=>s+(+e.amt||0),0);
 return `<div class="card"><h2>${title}</h2><div class="stats"><div class="stat"><b>${eur(money)}</b><span>Total dépensé en shopping</span></div></div></div>`+
 Object.keys(T).map(t=>`<div class="card"><h2>${T[t].n}</h2>${statsHTML(t,arr(t,f))}</div>`).join('');
}
function months(){const s=new Set([curMonth()]);Object.keys(T).forEach(t=>arr(t).forEach(e=>s.add(e.date.slice(0,7))));return[...s].sort().reverse()}

const PAL={sleep:[1,2,3,4,5,6].map(i=>`var(--c${i})`),food:['#1fb15a','#ff3b3b'],
 screen:['#1fb15a','#c4f56a','#ffe14d','#ffc23d','#ffa03d','#ff7f3d','#ff5a3d','#f03030','#c40f0f'],
 shop:['#1fb15a','#c4f56a','#ffe14d','#ffc23d','#ff8a3d','#ff5a3d','#e01f1f']};
const GL={sleep:LEG,food:['Pas de fast-food','Fast-food'],screen:['Aucun écran','Moins de 1h','1h – 2h','2h – 3h','3h – 4h','4h – 5h','5h – 6h','6h – 7h','Plus de 7h'],
 shop:['0 €','1 – 20 €','20 – 40 €','40 – 50 €','50 – 100 €','100 – 150 €','150 € et +']};
const GT={sleep:'Wake Up Tracker',food:'Fast-food',screen:'Temps d’écran',shop:'Shopping'};
const bScreen=m=>m<=0?0:m<60?1:m<120?2:m<180?3:m<240?4:m<300?5:m<360?6:m<420?7:8;
const bShop=a=>a<=0?0:a<=20?1:a<=40?2:a<=50?3:a<=100?4:a<150?5:6;
function dayMap(t){
 const m={};
 arr(t,e=>e.date.startsWith(yr)).forEach(e=>{
  if(t=='sleep')m[e.date]=COL(tm(e.wake)/60)-1;
  else if(t=='food')m[e.date]=Math.max(m[e.date]||0,e.yes!==false?1:0);
  else m[e.date]=(m[e.date]||0)+(t=='screen'?+e.min||0:+e.amt||0);
 });
 if(t=='screen'||t=='shop')for(const k in m)m[k]=(t=='screen'?bScreen:bShop)(m[k]);
 return m;
}
function dayGrid(t){
 const m=dayMap(t),P=PAL[t],L=GL[t];
 let h='<i></i>'+'JFMAMJJASOND'.split('').map(c=>`<i>${c}</i>`).join('');
 for(let d=1;d<=31;d++){h+=`<i>${d}</i>`;for(let mo=1;mo<=12;mo++){const k=`${yr}-${p(mo)}-${p(d)}`,ok=new Date(yr,mo-1,d).getMonth()==mo-1;h+=m[k]!=null?`<div title="${k} : ${L[m[k]]}" onclick="clearDay('${t}','${k}')" style="background:${P[m[k]]};cursor:pointer"></div>`:`<div title="${k}" style="${ok?'':'opacity:.15'}"></div>`}}
 return `<div class="card"><h2>${GT[t]} ${yr}</h2>
 <div class="row"><button class="btn" onclick="yr--;render()">◀</button><b>${yr}</b><button class="btn" onclick="yr++;render()">▶</button></div>
 <div class="leg">${L.map((l,i)=>`<span style="--k:${P[i]}">${l}</span>`).join('')}</div>
 <p><small>Tu t’es trompé ? Touche une case colorée pour effacer ce jour, puis ressaisis-le.</small></p>
 <div class="grid">${h}</div></div>`;
}

function trackerView(t){
 const c=T[t],list=arr(t).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 const inputs=c.f.map(([k,l,ty])=>{
  if(ty=='stars')return `<label>📺 ${l} (facultatif)<span class="stars">${starBtns(star,i=>`star=${i==star?0:i};render(true)`)}</span></label>`;
  if(ty=='yn')return `<label>${l}<select id="f_${k}"><option value="0">Non 🟢</option><option value="1">Oui 🔴</option></select></label>`;
  const num=ty=='number'||ty=='optnum'||ty=='hours',req=ty.startsWith('opt')?'':'required';
  return `<label>${l}<input id="f_${k}" type="${num?'number':ty=='opt'?'text':ty}" ${num?'min="0" step="'+(ty=='hours'?'0.25':'0.01')+'"':''} ${req}></label>`;
 }).join('');
 return `<div class="card"><h2>${c.n}</h2>
 <form onsubmit="add('${t}');return false"><label>Date${t=='sleep'?' du réveil':''}<input id="f_date" type="date" value="${today()}" required></label>${inputs}<button class="btn go">Ajouter</button></form></div>
 ${PAL[t]?dayGrid(t):''}
 <div class="card"><h2>Ce mois-ci</h2>${statsHTML(t,arr(t,e=>e.date.startsWith(curMonth())))}</div>
 <div class="card"><h2>Historique</h2><div class="list">${list.length?list.map(e=>`<div class="item"><div><b>${fdate(e.date)}</b> — ${line(t,e)}</div><button class="btn del" onclick="del('${t}',${e.id})" aria-label="Supprimer">✕</button></div>`).join(''):'<small>Rien pour l’instant. Ajoute ta première entrée ci-dessus.</small>'}</div></div>`;
}

function add(t){
 const e={id:Date.now(),date:$('#f_date').value};
 for(const[k,,ty]of T[t].f){
  if(ty=='stars'){e[k]=star;continue}
  const v=$('#f_'+k).value;
  e[k]=ty=='yn'?v=='1':ty=='hours'?Math.round((+v)*60):ty=='number'?+v:ty=='optnum'?(+v||0):v.trim();
 }
 if(t=='sleep'||t=='food')D[t]=(D[t]||[]).filter(x=>x.date!=e.date);
 (D[t]=D[t]||[]).push(e);star=0;save();render();
}
function clearDay(t,d){if(confirm('Effacer l’entrée du '+fdate(d)+' ? Tu pourras la ressaisir ensuite.')){D[t]=D[t].filter(e=>e.date!=d);save();render()}}
function rate(id,n){const e=D.series.find(x=>x.id==id);e.stars=e.stars==n?0:n;save();render()}
function del(t,id){if(confirm('Supprimer cette entrée ?')){D[t]=D[t].filter(e=>e.id!=id);save();render()}}

function globalView(){
 const ms=months();
 const rows=ms.map(m=>{const f=e=>e.date.startsWith(m),sl=arr('sleep',f),fo=arr('food',f),sc=arr('screen',f),se=arr('series',f),sh=arr('shop',f);
  const s=(a,k)=>a.reduce((x,e)=>x+(+e[k]||0),0);
  return `<tr><td>${mlabel(m)}</td><td>${sl.length?hm(sl.reduce((x,e)=>x+dur(e),0)/sl.length):'–'}</td><td>${fo.filter(e=>e.yes!==false).length} fois</td><td>${hm(s(sc,'min'))}</td><td>${se.length}</td><td>${eur(s(sh,'amt'))}</td></tr>`}).join('');
 return summary(()=>true,'Tout ce que j’ai fait depuis le début')+`<div class="card"><h2>Mois par mois</h2><div class="scroll"><table><tr><th>Mois</th><th>Sommeil moy.</th><th>Fast-food</th><th>Écran</th><th>Séries</th><th>Shopping</th></tr>${rows}</table></div></div>
 <div class="card"><h2>Sauvegarde</h2><p>Tes données sont enregistrées dans ce navigateur. Exporte-les pour les garder ou les transférer sur un autre appareil.</p>
 <div class="row"><button class="btn" onclick="exp()">Exporter (.json)</button><label class="btn">Importer<input type="file" accept=".json" hidden onchange="imp(this)"></label></div></div>`;
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='life-tracker-'+today()+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render()}catch(e){alert('Fichier invalide.')}};if(i.files[0])r.readAsText(i.files[0])}

function render(keep){
 try{localStorage.setItem('lt_tab',tab)}catch(e){}
 if(!P){
  $('#who').innerHTML='';$('#nav').innerHTML='';
  $('#view').innerHTML=`<div class="card"><h2>Bienvenue 👋</h2><p>Dis-moi qui tu es pour commencer. Tes données seront liées à ton adresse e-mail.</p>
  <form onsubmit="login();return false"><label>Prénom<input id="l_first" required autocomplete="given-name"></label><label>Nom<input id="l_last" required autocomplete="family-name"></label><label>Adresse e-mail<input id="l_mail" type="email" required autocomplete="email"></label><button class="btn go">Commencer</button></form></div>`;
  return;
 }
 $('#who').innerHTML=`<span>Salut <b>${esc(P.first)}</b> 👋</span><button class="btn" style="padding:3px 8px;font-size:.8rem" onclick="logout()">Changer de compte</button>`;
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';star=0;render()">${(T[t]||{n:NAMES[t]}).n}</button>`).join('');
 let h;
 if(tab=='month'){
  const m=monSel||curMonth(),ms=months();
  h=`<div class="card"><label>Mois affiché<select onchange="monSel=this.value;render()">${ms.map(x=>`<option value="${x}" ${x==m?'selected':''}>${mlabel(x)}${x==curMonth()?' (en cours)':''}</option>`).join('')}</select></label></div>`+summary(e=>e.date.startsWith(m),'Résumé de '+mlabel(m));
 }else if(tab=='global')h=globalView();else h=trackerView(tab);
 let sv=keep?['f_date',...T[tab].f.map(f=>'f_'+f[0])].map(i=>$('#'+i)&&$('#'+i).value):null;
 $('#view').innerHTML=h;
 if(sv)['f_date',...T[tab].f.map(f=>'f_'+f[0])].forEach((i,n)=>{if($('#'+i)&&sv[n]!=null)$('#'+i).value=sv[n]});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script></body></html>
